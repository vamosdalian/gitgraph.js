name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run test:ci
      - name: Publish public packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish -w @vamosdalian/gitgraph-core --access public --provenance
          npm publish -w @vamosdalian/gitgraph-js --access public --provenance
          npm publish -w @vamosdalian/gitgraph-react --access public --provenance
          npm publish -w @vamosdalian/gitgraph-node --access public --provenance
